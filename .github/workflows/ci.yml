name: CI

on:
  push:
  pull_request:

jobs:
  verify-seed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: reliefdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/reliefdb?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-please-change-32-characters
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run migrations
        run: npm run db:migrate
      - name: Seed database
        run: npm run db:seed
      - name: Verify seed data
        run: npm run verify-seed
      - name: Build app
        run: npm run build
      - name: Start app
        run: npm run start &
      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000/login > /dev/null; then
              echo "App is up";
              exit 0;
            fi
            sleep 2;
          done
          echo "App did not start in time";
          exit 1
      - name: Run API smoke tests
        run: npm run test:api
        env:
          API_BASE_URL: http://localhost:3000
